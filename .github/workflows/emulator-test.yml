name: Emulator test
# Marko, 23.11.2026: "install it in emulator ... and test". Boots an Android emulator on the runner, installs the latest
# release APK (or the build number given), opens the new screens and the box, uploads the screenshots.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number (empty = Latest release)"
        required: false
        default: ""
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.build }}" ]; then gh release download "build-${{ inputs.build }}" -p '*.apk' -O ttt.apk
          else gh release download -p '*.apk' -O ttt.apk; fi
          ls -la ttt.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/emulator_smoke.sh ttt.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: shots/
